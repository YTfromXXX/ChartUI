<title>IBM Quantum Backend League</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #040d1c; --bg2: #071428; --bg3: #0a1a30;
  --fg: #e8eaf6; --muted: #8899b8; --subtle: #2a3a5a;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding: max(28px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(32px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
}

.page-header { text-align: center; margin-bottom: 32px; }
.page-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(22px, 5vw, 36px); font-weight: 800;
  letter-spacing: -0.5px; color: var(--fg);
}
.page-title span { color: #4589ff; }
.page-sub {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; color: var(--muted); margin-top: 6px; letter-spacing: 1px;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  max-width: 820px;
  margin: 0 auto 32px;
}
@media (max-width: 560px) { .cards-grid { grid-template-columns: 1fr; } }

/* ── CARD ── */
.card {
  background: var(--bg2);
  border-radius: 14px;
  border: 1px solid var(--subtle);
  overflow: hidden;
  opacity: 0;
  transform: translateY(16px);
  animation: card-in .5s ease forwards;
  position: relative;
}
.card:nth-child(1) { animation-delay: 0ms; }
.card:nth-child(2) { animation-delay: 100ms; }
.card:nth-child(3) { animation-delay: 200ms; }
.card:nth-child(4) { animation-delay: 300ms; }
@keyframes card-in {
  to { opacity: 1; transform: translateY(0); }
}
.card.flash { animation: card-flash .5s ease; }
@keyframes card-flash {
  0%,100% { box-shadow: none; }
  50% { box-shadow: 0 0 40px var(--accent-color), 0 0 80px var(--accent-color); }
}

/* top band */
.card-band {
  padding: 18px 20px 14px;
  background: linear-gradient(135deg, rgba(var(--accent-rgb),.18), rgba(var(--accent-rgb),.06));
  border-bottom: 1px solid rgba(var(--accent-rgb),.2);
  display: flex; align-items: center; gap: 14px; position: relative;
}
.card-icon {
  width: 44px; height: 44px; border-radius: 10px;
  background: rgba(var(--accent-rgb),.2); border: 1.5px solid rgba(var(--accent-rgb),.5);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 800;
  color: var(--accent-color); flex-shrink: 0;
}
.card-name {
  font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700;
  color: var(--fg); line-height: 1.3;
}
.card-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
.card-score {
  margin-left: auto; text-align: right;
}
.score-num {
  font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 800;
  color: var(--accent-color); line-height: 1;
}
.score-label { font-size: 10px; color: var(--muted); letter-spacing: .5px; }

/* champion badge */
.champion-badge {
  position: absolute; top: 10px; right: 10px;
  background: rgba(232,184,75,.15); border: 1px solid rgba(232,184,75,.5);
  border-radius: 20px; padding: 3px 10px;
  font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700;
  color: #e8b84b; animation: badge-pulse 2s ease-in-out infinite;
}
@keyframes badge-pulse {
  0%,100% { box-shadow: 0 0 6px rgba(232,184,75,.3); }
  50%      { box-shadow: 0 0 18px rgba(232,184,75,.6); }
}

/* body */
.card-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

/* fidelity */
.fidelity-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.fidelity-label { font-size: 11px; color: var(--muted); letter-spacing: .5px; }
.fidelity-pct { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: var(--accent-color); }
.fidelity-track {
  height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden;
}
.fidelity-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, rgba(var(--accent-rgb),.5), var(--accent-color));
  width: 0%; transition: width 1.4s cubic-bezier(.22,1,.36,1);
}

/* stats */
.stats-row {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 8px;
}
.stat-cell {
  background: var(--bg3); border-radius: 8px; padding: 8px 10px; text-align: center;
}
.stat-val {
  font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700;
  color: var(--fg); display: block;
}
.stat-key { font-size: 10px; color: var(--muted); margin-top: 2px; display: block; }

/* waveform */
.waveform-wrap { height: 36px; overflow: hidden; }
.wave-svg { width: 100%; height: 36px; }

/* stamps */
.stamps-row { display: flex; gap: 10px; justify-content: center; padding-top: 4px; }
.stamp-slot {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: default;
}
.stamp-hex-svg { transition: transform .3s; }
.stamp-hex-text {
  font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted);
  letter-spacing: .5px; min-height: 12px; text-align: center;
}
.stamp-slot.filled .stamp-hex-text { color: var(--accent-color); }
.stamp-slot.stamp-pop .stamp-hex-svg { animation: stamp-pop .4s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes stamp-pop {
  from { transform: scale(0) rotate(-20deg); opacity: 0; }
  to   { transform: scale(1) rotate(0deg);  opacity: 1; }
}

/* ── STAMP INPUT ── */
.stamp-section {
  max-width: 820px; margin: 0 auto;
  background: var(--bg2); border: 1px solid var(--subtle);
  border-radius: 14px; padding: 24px 24px;
}
.stamp-section-title {
  font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700;
  color: var(--fg); margin-bottom: 4px;
}
.stamp-section-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
.stamp-input-row { display: flex; gap: 10px; flex-wrap: wrap; }
.stamp-input {
  flex: 1; min-width: 200px;
  background: var(--bg3); border: 1px solid var(--subtle);
  border-radius: 8px; padding: 12px 16px;
  font-family: 'Space Mono', monospace; font-size: 14px; color: var(--fg);
  letter-spacing: 1px; outline: none;
  transition: border-color .2s;
}
.stamp-input:focus { border-color: #4589ff; }
.stamp-input::placeholder { color: var(--subtle); }
.stamp-btn {
  padding: 12px 24px; border-radius: 8px;
  background: linear-gradient(135deg, rgba(69,137,255,.2), rgba(69,137,255,.1));
  border: 1.5px solid rgba(69,137,255,.5); color: #4589ff;
  font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all .2s; white-space: nowrap;
}
.stamp-btn:hover { background: rgba(69,137,255,.25); box-shadow: 0 0 16px rgba(69,137,255,.2); }
.stamp-msg { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 18px; }
.stamp-msg.ok { color: #69f0ae; }
.stamp-msg.err { color: #ef9a9a; }
</style>

<div class="page-header">
  <div class="page-title">IBM <span>Quantum</span> Backend League</div>
  <div class="page-sub">バックエンド × ベンチマーク競技 · Season 2026</div>
</div>

<div class="cards-grid" id="cardsGrid"></div>

<div class="stamp-section">
  <div class="stamp-section-title">Quantum Baby トークンを刻印する</div>
  <div class="stamp-section-sub">Quantum Baby Signature で生成した 16文字 hex トークンを入力してください</div>
  <div class="stamp-input-row">
    <input class="stamp-input" id="stampInput" type="text" maxlength="16" placeholder="add435abfe106be3" autocomplete="off" spellcheck="false">
    <button class="stamp-btn" onclick="doStamp()">刻印 ▶</button>
  </div>
  <div class="stamp-msg" id="stampMsg"></div>
</div>

<script>
const BACKENDS = [
  {
    id: 'marrakesh',
    name: 'ibm_marrakesh',
    icon: 'M',
    desc: 'エラー訂正重視',
    accent: '#e8832a',
    accentRgb: '232,131,42',
    fidelity: 94.2,
    gateTime: 0.42,
    qubits: 127,
    t2: 312,
    freq: 1.8,
    score: 2847,
    champion: false,
  },
  {
    id: 'brisbane',
    name: 'ibm_brisbane',
    icon: 'B',
    desc: '低デコヒーレンス',
    accent: '#4fc3c8',
    accentRgb: '79,195,200',
    fidelity: 97.8,
    gateTime: 0.28,
    qubits: 127,
    t2: 428,
    freq: 2.4,
    score: 3291,
    champion: false,
  },
  {
    id: 'kyoto',
    name: 'ibm_kyoto',
    icon: 'K',
    desc: '多qubit複雑回路',
    accent: '#a78ed0',
    accentRgb: '167,142,208',
    fidelity: 91.5,
    gateTime: 0.55,
    qubits: 156,
    t2: 287,
    freq: 1.4,
    score: 1956,
    champion: false,
  },
  {
    id: 'sherbrooke',
    name: 'ibm_sherbrooke',
    icon: 'S',
    desc: '長寿命・安定',
    accent: '#e8b84b',
    accentRgb: '232,184,75',
    fidelity: 98.9,
    gateTime: 0.31,
    qubits: 127,
    t2: 512,
    freq: 3.0,
    score: 4102,
    champion: true,
  },
];

// stamp state: array of 3 slots per card
const stamps = { marrakesh: ['','',''], brisbane: ['','',''], kyoto: ['','',''], sherbrooke: ['','',''] };

function buildWavePath(freq, accent, id) {
  const W = 400, H = 36, cx = W / 2;
  const pts = [];
  for (let x = 0; x <= W; x += 4) {
    const y = H/2 + Math.sin((x / W) * Math.PI * 2 * freq) * 10;
    pts.push(`${x},${y}`);
  }
  const pathD = 'M' + pts.join(' L');
  const len = W * 1.2; // approx length
  return `<svg class="wave-svg" viewBox="0 0 400 36" preserveAspectRatio="none">
    <path d="${pathD}" fill="none" stroke="${accent}" stroke-width="1.5" opacity="0.6"
      stroke-dasharray="${len}" stroke-dashoffset="${len}">
      <animate attributeName="stroke-dashoffset" from="${len}" to="0" dur="1.6s" fill="freeze" begin="0.3s"/>
    </path>
    <path d="${pathD}" fill="none" stroke="${accent}" stroke-width="0.5" opacity="0.25"
      stroke-dasharray="${len}" stroke-dashoffset="${len}">
      <animate attributeName="stroke-dashoffset" from="${len}" to="0" dur="2.2s" fill="freeze" begin="0.1s"/>
    </path>
  </svg>`;
}

function hexSlotSvg(filled, accent, accentRgb) {
  const pts = hexPoints(22, 22, 20);
  const poly = pts.map(p => `${p[0]},${p[1]}`).join(' ');
  if (filled) {
    return `<svg width="44" height="44" viewBox="0 0 44 44">
      <polygon points="${poly}" fill="rgba(${accentRgb},.18)" stroke="${accent}" stroke-width="1.5"/>
      <polygon points="${hexPoints(22,22,16).map(p=>p.join(',')).join(' ')}" fill="rgba(${accentRgb},.12)"/>
    </svg>`;
  }
  return `<svg width="44" height="44" viewBox="0 0 44 44">
    <polygon points="${poly}" fill="none" stroke="rgba(80,100,140,.4)" stroke-width="1" stroke-dasharray="3,3"/>
  </svg>`;
}

function hexPoints(cx, cy, r) {
  return Array.from({length:6}, (_,i) => {
    const a = (i * Math.PI / 3) - Math.PI / 6;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  });
}

function buildCard(b) {
  const champBadge = b.champion ? `<div class="champion-badge">👑 QPU王者</div>` : '';

  const slotHtml = [0,1,2].map(i => {
    const val = stamps[b.id][i];
    const filled = val !== '';
    return `<div class="stamp-slot${filled?' filled':''}" id="slot-${b.id}-${i}">
      <div class="stamp-hex-svg">${hexSlotSvg(filled, b.accent, b.accentRgb)}</div>
      <div class="stamp-hex-text">${val || ''}</div>
    </div>`;
  }).join('');

  return `<div class="card" id="card-${b.id}" style="--accent-color:${b.accent};--accent-rgb:${b.accentRgb};">
    <div class="card-band">
      <div class="card-icon">${b.icon}</div>
      <div>
        <div class="card-name">${b.name}</div>
        <div class="card-desc">${b.desc}</div>
      </div>
      <div class="card-score">
        <div class="score-num" id="score-${b.id}">0</div>
        <div class="score-label">SCORE</div>
      </div>
      ${champBadge}
    </div>
    <div class="card-body">
      <div>
        <div class="fidelity-row">
          <span class="fidelity-label">FIDELITY</span>
          <span class="fidelity-pct">${b.fidelity}%</span>
        </div>
        <div class="fidelity-track"><div class="fidelity-fill" id="bar-${b.id}"></div></div>
      </div>
      <div class="stats-row">
        <div class="stat-cell">
          <span class="stat-val" id="stat-gate-${b.id}">0.00</span>
          <span class="stat-key">Gate µs</span>
        </div>
        <div class="stat-cell">
          <span class="stat-val" id="stat-qubits-${b.id}">0</span>
          <span class="stat-key">Qubits</span>
        </div>
        <div class="stat-cell">
          <span class="stat-val" id="stat-t2-${b.id}">0</span>
          <span class="stat-key">T2 µs</span>
        </div>
      </div>
      <div class="waveform-wrap">${buildWavePath(b.freq, b.accent, b.id)}</div>
      <div class="stamps-row" id="stamps-${b.id}">${slotHtml}</div>
    </div>
  </div>`;
}

// Render cards
document.getElementById('cardsGrid').innerHTML = BACKENDS.map(buildCard).join('');

// Animate fidelity bars and counters after paint
requestAnimationFrame(() => {
  setTimeout(() => {
    BACKENDS.forEach((b, i) => {
      setTimeout(() => {
        // fidelity bar
        const bar = document.getElementById(`bar-${b.id}`);
        if (bar) bar.style.width = b.fidelity + '%';

        // score counter
        animateCount(`score-${b.id}`, 0, b.score, 1500);

        // gate time
        animateCountFloat(`stat-gate-${b.id}`, 0, b.gateTime, 1200, 2);

        // qubits
        animateCount(`stat-qubits-${b.id}`, 0, b.qubits, 1000);

        // T2
        animateCount(`stat-t2-${b.id}`, 0, b.t2, 1300);
      }, i * 120);
    });
  }, 300);
});

function animateCount(elId, from, to, dur) {
  const el = document.getElementById(elId);
  if (!el) return;
  const start = performance.now();
  function step(now) {
    const p = Math.min((now - start) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * ease);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function animateCountFloat(elId, from, to, dur, decimals) {
  const el = document.getElementById(elId);
  if (!el) return;
  const start = performance.now();
  function step(now) {
    const p = Math.min((now - start) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = (from + (to - from) * ease).toFixed(decimals);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// Stamp function
function doStamp() {
  const input = document.getElementById('stampInput');
  const msg = document.getElementById('stampMsg');
  const val = input.value.trim().toLowerCase();

  if (!/^[0-9a-f]{16}$/.test(val)) {
    msg.textContent = '⚠ 16文字の hex トークンを入力してください (例: add435abfe106be3)';
    msg.className = 'stamp-msg err';
    return;
  }

  // Find cards with empty slots
  const available = BACKENDS.filter(b => stamps[b.id].some(s => s === ''));
  if (available.length === 0) {
    msg.textContent = '全スロットが埋まっています';
    msg.className = 'stamp-msg err';
    return;
  }

  // Pick random available card
  const b = available[Math.floor(Math.random() * available.length)];
  const slotIdx = stamps[b.id].findIndex(s => s === '');
  const shortVal = val.slice(0, 8);
  stamps[b.id][slotIdx] = shortVal;

  // Update slot DOM
  const slotEl = document.getElementById(`slot-${b.id}-${slotIdx}`);
  if (slotEl) {
    slotEl.classList.add('filled');
    slotEl.querySelector('.stamp-hex-svg').innerHTML = hexSlotSvg(true, b.accent, b.accentRgb);
    slotEl.querySelector('.stamp-hex-text').textContent = shortVal;
    slotEl.classList.add('stamp-pop');
    setTimeout(() => slotEl.classList.remove('stamp-pop'), 500);
  }

  // Flash card
  const cardEl = document.getElementById(`card-${b.id}`);
  if (cardEl) {
    cardEl.style.setProperty('--accent-color', b.accent);
    cardEl.classList.remove('flash');
    void cardEl.offsetWidth;
    cardEl.classList.add('flash');
    setTimeout(() => cardEl.classList.remove('flash'), 600);
  }

  msg.textContent = `✓ ${b.name} スロット ${slotIdx + 1} に刻印しました — ${shortVal}`;
  msg.className = 'stamp-msg ok';
  input.value = '';
}

// Enter key on input
document.getElementById('stampInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doStamp();
});
</script>
