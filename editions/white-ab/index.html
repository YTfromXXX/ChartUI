<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ホワイトアウト版 AB — サトシを探せ版</title>
  <style>
    :root { --paper: #ffffff; --ink: #1f1f1f; --sub: #57534e; --red: #c8001a; --line: #e7e5e4; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    main { max-width: 980px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    h1 { font-size: 18px; margin: 0; letter-spacing: .05em; }
    h1 span { color: var(--red); }
    .hint { color: var(--sub); font-size: 12px; }
    canvas { display: block; width: 100%; height: auto; border: 1px solid var(--line); margin-top: 12px; touch-action: none; cursor: crosshair; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; align-items: center; }
    button { font: inherit; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); padding: 4px 10px; cursor: pointer; }
    button:hover { background: var(--ink); color: var(--paper); }
    #status { color: var(--sub); }
    footer { margin-top: 16px; font-size: 11px; color: var(--sub); border-top: 1px solid var(--line); padding-top: 8px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ChartUI <span>ホワイトアウト版 AB</span> — サトシを探せ版</h1>
      <span class="hint">クリック／Enter で進む · 1・2・3 で選ぶ · R で最初から</span>
    </header>
    <canvas id="stage" width="960" height="540" aria-label="ゲームの画面"></canvas>
    <div class="bar">
      <button id="next" type="button">進む</button>
      <button id="restart" type="button">最初から</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <footer>
      架空の物語です。登場する鍵・署名・残高はすべて作りものです。実在の人物を特定するものではありません。<br />
      取引や暮らしのことでつらいときは、ひとりで抱えずに：よりそいホットライン 0120-279-338（24 時間・無料）／いのちの電話 0570-783-556
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
