<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mermaid Dance Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<style>
:root {
  --bg: #04050e;
  --panel: rgba(6,8,22,0.88);
  --accent: #4fc3f7;
  --accent2: #69f0ae;
  --text: #e8eaf6;
  --muted: #546e7a;
  --border: rgba(79,195,247,0.15);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Inter', sans-serif; }

#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 7px max(14px, env(safe-area-inset-left,0px));
  background: linear-gradient(to bottom, rgba(4,5,14,0.96) 70%, transparent);
}
#header h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(12px,2vw,16px); font-weight: 700; letter-spacing: .07em;
  color: var(--accent); text-shadow: 0 0 14px rgba(79,195,247,.5); flex: 1;
}
.ratio-btn {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(10px,1.5vw,13px); font-weight: 700;
  padding: 5px 13px; border-radius: 20px;
  border: 1.5px solid var(--border); background: transparent;
  color: var(--muted); cursor: pointer; transition: all .2s;
  letter-spacing: .05em;
}
.ratio-btn.active {
  background: var(--accent); color: #04050e;
  border-color: var(--accent); box-shadow: 0 0 14px rgba(79,195,247,.5);
}
.sfx-btn { font-size:14px; padding:4px 7px; border-radius:14px; border:1px solid var(--border); background:transparent; cursor:pointer; transition:all .18s; line-height:1; }
.sfx-btn.active { background:var(--accent2); box-shadow:0 0 10px rgba(105,240,174,.4); }
#sfx-row { display:flex; gap:3px; align-items:center; }
#start-btn {
  font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700;
  padding: 5px 16px; border-radius: 20px; border: none;
  background: linear-gradient(135deg,#4fc3f7,#69f0ae); color: #04050e;
  cursor: pointer; transition: opacity .2s;
}
#bpm-info {
  font-size: 10px; color: var(--muted);
  font-family: 'Space Grotesk', sans-serif; white-space: nowrap;
}

#canvas-wrap { position: fixed; inset: 0; }
#canvas-wrap canvas { display: block; }

#contact-panel {
  position: fixed; top: 46px; right: max(10px,env(safe-area-inset-right,0px)); z-index: 20;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 12px; min-width: 148px;
  backdrop-filter: blur(8px);
}
#contact-panel h3 {
  font-family: 'Space Grotesk', sans-serif; font-size: 9px;
  color: var(--muted); margin-bottom: 5px; letter-spacing: .1em; text-transform: uppercase;
}
.contact-row { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
.contact-row .lbl { font-size: 9px; color: var(--text); min-width: 36px; }
.cbar-wrap { flex: 1; height: 3px; background: rgba(255,255,255,.07); border-radius: 2px; overflow: hidden; }
.cbar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg,#69f0ae,#4fc3f7); transition: width .6s; }
.cpct { font-size: 9px; color: var(--muted); min-width: 24px; text-align: right; }

#mode-badge {
  position: fixed; top: 46px; left: max(10px,env(safe-area-inset-left,0px)); z-index: 20;
  font-family: 'Space Grotesk', sans-serif; font-size: 10px; color: var(--muted);
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 7px; padding: 4px 10px; backdrop-filter: blur(6px);
}
#hint {
  position: fixed; top: 74px; left: max(10px,env(safe-area-inset-left,0px)); z-index: 20;
  font-size: 9px; color: rgba(84,110,122,.8);
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 7px; padding: 3px 9px; backdrop-filter: blur(6px);
}
#char-cards {
  position: fixed; bottom: max(8px,env(safe-area-inset-bottom,0px));
  left: 0; right: 0; z-index: 20;
  display: flex; gap: 5px; overflow-x: auto; padding: 0 max(14px,env(safe-area-inset-left,0px));
  scrollbar-width: none;
}
#char-cards::-webkit-scrollbar { display: none; }
.char-card {
  flex: 0 0 auto; background: var(--panel); border: 1px solid var(--border);
  border-radius: 9px; padding: 4px 9px; text-align: center;
}
.cname { font-family: 'Space Grotesk', sans-serif; font-size: 9px; font-weight: 700; color: var(--accent); }
.cgenre { font-size: 8px; color: var(--muted); margin-top: 1px; }
.cact { height: 2px; border-radius: 1px; margin-top: 3px; transition: width .4s; }
</style>
</head>
<body>
<div id="header">
  <h1>🎼 Mermaid Dance Studio</h1>
  <button class="ratio-btn active" id="btn-golden" onclick="setRatio('golden')">黄金比 φ</button>
  <button class="ratio-btn" id="btn-yamato" onclick="setRatio('yamato')">大和比 √2</button>
  <span id="bpm-info">— BPM</span>
  <div id="sfx-row">
    <button class="sfx-btn active" title="Bloop" onclick="setSfx('bloop',event)">💧</button>
    <button class="sfx-btn" title="Zap"   onclick="setSfx('zap',event)">⚡</button>
    <button class="sfx-btn" title="Surf"  onclick="setSfx('surf',event)">🌊</button>
    <button class="sfx-btn" title="Bell"  onclick="setSfx('bell',event)">✨</button>
  </div>
  <button id="start-btn" onclick="startAudio()">▶ START</button>
</div>
<div id="mode-badge">φ² × φ × 1</div>
<div id="hint">Tap → shoot bubble &amp; spawn creature</div>
<div id="contact-panel"><h3>Contact Rate</h3><div id="contact-rows"></div></div>
<div id="canvas-wrap"><div id="p5host"></div></div>
<div id="char-cards"></div>

<script>
/* ── constants ───────────────────────────────────────────── */
const PHI = (1 + Math.sqrt(5)) / 2;
const SQ2 = Math.sqrt(2);
const RATIOS = {
  golden: { w: PHI*PHI, h: PHI, d: 1, label:'φ² × φ × 1', bpm:124, style:'house'  },
  yamato: { w: 2,       h: SQ2, d: 1, label:'2 × √2 × 1',  bpm:170, style:'jungle' },
};
let currentRatio = 'golden';

const CHARS = [
  {id:0,name:'Ariel',   genre:'Pop',       h:10,  s:85,b:85},
  {id:1,name:'Andrina', genre:'R&B',       h:30,  s:70,b:65},
  {id:2,name:'Arista',  genre:'Rock',      h:15,  s:80,b:70},
  {id:3,name:'Aquata',  genre:'Jazz',      h:215, s:65,b:72},
  {id:4,name:'Attina',  genre:'Classical', h:40,  s:75,b:75},
  {id:5,name:'Adella',  genre:'EDM',       h:270, s:80,b:80},
  {id:6,name:'Alana',   genre:'Reggae',    h:55,  s:70,b:72},
];

const DANCE = [
  {fx:1.00,fy:0.618,fz:1.618,px:0.00,py:1.00,pz:2.00},
  {fx:1.50,fy:1.000,fz:0.500,px:1.00,py:0.00,pz:0.50},
  {fx:0.75,fy:1.400,fz:1.000,px:2.00,py:1.50,pz:0.00},
  {fx:2.00,fy:0.500,fz:1.500,px:0.50,py:2.00,pz:1.00},
  {fx:1.20,fy:1.800,fz:0.800,px:1.50,py:0.50,pz:2.50},
  {fx:0.90,fy:1.100,fz:2.000,px:2.50,py:1.80,pz:0.30},
  {fx:1.70,fy:0.900,fz:1.300,px:0.80,py:2.30,pz:1.70},
];

/* ── bass patterns ───────────────────────────────────────── */
const HOUSE_KICK  = [1,0,0,0,1,0,0,0,1,0,0,0,1,0,0,0]; // 4-on-floor
const HOUSE_BASS  = ['C1','C1','F1','F1','G1','G1','Bb1','Bb1','C1','C1','G1','G1','F1','F1','Eb1','C1'];
const HOUSE_SUB   = ['C0',null,null,null,'F0',null,null,null,'G0',null,null,null,'Bb0',null,null,null];

const JUNGLE_KICK = [1,0,0,1,0,1,0,0,1,0,1,0,0,1,0,0]; // amen-ish
const JUNGLE_BASS = ['E1','E1','G1','A1','C2','A1','G1','E1','D1','D1','F1','G1','Bb1','G1','F1','D1'];
const JUNGLE_SUB  = ['E0',null,null,'A0',null,null,'C1',null,'E0',null,null,'G0',null,null,'B0',null];

/* ── audio state ─────────────────────────────────────────── */
let audioStarted = false;
let kickSynth, bassSynth, subSynth;
let kickSeq, bassSeq, subSeq;
let masterLPF;
let dropFilter; // sweepable filter for transitions
let isDropping = false;

async function startAudio() {
  if (audioStarted) return;
  await Tone.start();
  document.getElementById('start-btn').textContent = '◼ LIVE';
  document.getElementById('start-btn').style.cssText = 'background:rgba(79,195,247,.15);color:var(--accent);border:1px solid var(--border);padding:5px 16px;border-radius:20px;cursor:pointer;font-family:"Space Grotesk",sans-serif;font-size:12px;font-weight:700;';

  masterLPF  = new Tone.Filter({ frequency:280, type:'lowpass', rolloff:-24 }).toDestination();
  dropFilter = new Tone.Filter({ frequency:280, type:'lowpass', rolloff:-12 });
  dropFilter.connect(masterLPF);

  sfxOut = new Tone.Reverb({decay:.3, wet:.15}).toDestination();
  sfxSynths.bloop = new Tone.MembraneSynth({pitchDecay:.04,octaves:5,envelope:{attack:.001,decay:.2,sustain:0,release:.07}});
  sfxSynths.bloop.volume.value=-8; sfxSynths.bloop.connect(sfxOut);
  sfxSynths.zap = new Tone.Synth({oscillator:{type:'square'},envelope:{attack:.001,decay:.07,sustain:0,release:.03}});
  sfxSynths.zap.volume.value=-14; sfxSynths.zap.connect(sfxOut);
  sfxSynths.surf = new Tone.NoiseSynth({noise:{type:'pink'},envelope:{attack:.008,decay:.24,sustain:0,release:.1}});
  sfxSynths.surf.volume.value=-16; sfxSynths.surf.connect(sfxOut);
  sfxSynths.bell = new Tone.MetalSynth({frequency:200,envelope:{attack:.001,decay:.55,release:.25},harmonicity:5.1,modulationIndex:32,resonance:3000,octaves:.5});
  sfxSynths.bell.volume.value=-14; sfxSynths.bell.connect(sfxOut);

  kickSynth = new Tone.MembraneSynth({ pitchDecay:.06, octaves:8,
    envelope:{attack:.001,decay:.35,sustain:0,release:.1} });
  kickSynth.volume.value = 2;
  kickSynth.connect(dropFilter);

  bassSynth = new Tone.MonoSynth({
    oscillator:{type:'sawtooth'},
    filter:{type:'lowpass',frequency:200,rolloff:-12},
    envelope:{attack:.01,decay:.2,sustain:.6,release:.18},
    filterEnvelope:{attack:.01,decay:.12,sustain:.4,release:.2,baseFrequency:80,octaves:2}
  });
  bassSynth.volume.value = -4;
  bassSynth.connect(dropFilter);

  subSynth = new Tone.Synth({
    oscillator:{type:'sine'},
    envelope:{attack:.04,decay:.4,sustain:.7,release:.5}
  });
  subSynth.volume.value = -2;
  subSynth.connect(dropFilter);

  audioStarted = true;
  loadMode(currentRatio, false);
}

function loadMode(mode, withDrop) {
  const cfg = RATIOS[mode];
  if (!audioStarted) return;

  if (withDrop) {
    isDropping = true;
    // Filter sweep down then up = "drop" effect
    dropFilter.frequency.cancelScheduledValues(Tone.now());
    dropFilter.frequency.rampTo(40, 0.18, Tone.now());
    dropFilter.frequency.rampTo(280, 0.5, Tone.now() + 0.22);
    setTimeout(() => { isDropping = false; }, 700);
  }

  Tone.getTransport().stop();
  Tone.getTransport().cancel();
  Tone.getTransport().bpm.value = cfg.bpm;
  document.getElementById('bpm-info').textContent = cfg.bpm + ' BPM · Bass Drop';

  const kicks = cfg.style === 'house' ? HOUSE_KICK  : JUNGLE_KICK;
  const basses = cfg.style === 'house' ? HOUSE_BASS  : JUNGLE_BASS;
  const subs   = cfg.style === 'house' ? HOUSE_SUB   : JUNGLE_SUB;

  if (kickSeq)  { kickSeq.stop();  kickSeq.dispose();  }
  if (bassSeq)  { bassSeq.stop();  bassSeq.dispose();  }
  if (subSeq)   { subSeq.stop();   subSeq.dispose();   }

  kickSeq = new Tone.Sequence((time, hit) => {
    if (hit) kickSynth.triggerAttackRelease('C1','8n',time);
  }, kicks, '16n');
  kickSeq.loop = true;

  bassSeq = new Tone.Sequence((time, note) => {
    if (note) bassSynth.triggerAttackRelease(note,'16n',time);
  }, basses, '16n');
  bassSeq.loop = true;

  subSeq = new Tone.Sequence((time, note) => {
    if (note) subSynth.triggerAttackRelease(note,'4n',time);
  }, subs, '16n');
  subSeq.loop = true;

  kickSeq.start(0); bassSeq.start(0); subSeq.start(0);
  Tone.getTransport().start('+0.05');
}

function setRatio(mode) {
  if (mode === currentRatio) return;
  currentRatio = mode;
  document.getElementById('btn-golden').classList.toggle('active', mode==='golden');
  document.getElementById('btn-yamato').classList.toggle('active', mode==='yamato');
  document.getElementById('mode-badge').textContent = RATIOS[mode].label;
  if (audioStarted) loadMode(mode, true);
  else document.getElementById('bpm-info').textContent = RATIOS[mode].bpm + ' BPM';
}

/* ── contact tracking ───────────────────────────────────── */
const contactFrames = Array.from({length:7}, () => new Array(7).fill(0));
const contactActive = Array.from({length:7}, () => new Array(7).fill(false));
let totalFrames = 1;

function buildContactUI() {
  const c = document.getElementById('contact-rows'); c.innerHTML = '';
  const pairs=[];
  for(let i=0;i<7;i++) for(let j=i+1;j<7;j++) pairs.push([i,j]);
  pairs.slice(0,6).forEach(([i,j]) => {
    const r = document.createElement('div'); r.className='contact-row';
    r.innerHTML = `<span class="lbl">${CHARS[i].name[0]}↔${CHARS[j].name[0]}</span><div class="cbar-wrap"><div class="cbar-fill" id="cf-${i}-${j}" style="width:0%"></div></div><span class="cpct" id="cp-${i}-${j}">0%</span>`;
    c.appendChild(r);
  });
}
function updateContactUI() {
  for(let i=0;i<7;i++) for(let j=i+1;j<7;j++) {
    const pct = Math.min(100,(contactFrames[i][j]/totalFrames)*100);
    const e=document.getElementById(`cf-${i}-${j}`);
    const ep=document.getElementById(`cp-${i}-${j}`);
    if(e) e.style.width=pct.toFixed(1)+'%';
    if(ep) ep.textContent=pct.toFixed(0)+'%';
  }
}

function buildCharCards() {
  const c = document.getElementById('char-cards'); c.innerHTML='';
  CHARS.forEach(ch => {
    const d=document.createElement('div'); d.className='char-card'; d.id=`card-${ch.id}`;
    d.innerHTML=`<div class="cname">${ch.name}</div><div class="cgenre">${ch.genre}</div><div class="cact" id="act-${ch.id}" style="background:hsl(${ch.h},${ch.s}%,${ch.b}%);width:50%"></div>`;
    c.appendChild(d);
  });
}
buildContactUI(); buildCharCards();
document.getElementById('bpm-info').textContent = RATIOS[currentRatio].bpm + ' BPM';

/* ── sfx ─────────────────────────────────────────────────── */
let selectedSfx='bloop', sfxSynths={}, sfxOut;
function setSfx(t,e){
  selectedSfx=t;
  document.querySelectorAll('.sfx-btn').forEach(b=>b.classList.remove('active'));
  if(e&&e.target) e.target.classList.add('active');
}
function playSfx(t){
  if(!audioStarted) return;
  const s=sfxSynths[t]; if(!s) return;
  try{
    if(t==='surf') s.triggerAttackRelease('16n',Tone.now());
    else if(t==='bell') s.triggerAttackRelease(Tone.now());
    else s.triggerAttackRelease(t==='bloop'?'C2':'A4','16n',Tone.now());
  }catch(_){}
}
/* ── bubble & creature pools ─────────────────────────────── */
const bubbles   = [];
const creatures = [];
let creatureCount = 0;
const MAX_BUBBLES   = 60;
const MAX_CREATURES = 50;

function spawnBubbles(mx, my) {
  playSfx(selectedSfx);
  const count = 4 + Math.floor(Math.random()*4);
  for(let i=0;i<count;i++) {
    const angle = (i/count)*Math.PI*2 + Math.random()*0.5;
    const speed = 1.5 + Math.random()*3;
    bubbles.push({
      x: mx, y: my,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed - 1.5,
      r: 6 + Math.random()*10,
      life: 1.0,
      hue: 140 + Math.random()*60, // greenish
      born: performance.now(),
      popped: false,
    });
    if(bubbles.length > MAX_BUBBLES) bubbles.shift();
  }
}

function spawnCreature(x, y) {
  const gen = creatureCount++;
  const hue = 120 + Math.min(100, gen * 2.5); // 120=green → 220=blue
  const type = gen % 5; // 0=amoeba,1=jellyfish,2=polyp,3=starfish,4=medusa
  creatures.push({
    x, y,
    vx: (Math.random()-.5)*0.6,
    vy: (Math.random()-.5)*0.6,
    r: 14 + Math.random()*20,
    hue, type, gen,
    phase: Math.random()*Math.PI*2,
    rotSpd: (Math.random()-.5)*0.012,
    rot: Math.random()*Math.PI*2,
    alpha: 0,
    arms: 4 + Math.floor(Math.random()*4),
    pts: Array.from({length:12}, (_,i) => ({
      off: (Math.random()-.5)*0.4,
      freq: 1+Math.random()*3,
      ph: Math.random()*Math.PI*2,
    })),
  });
  if(creatures.length > MAX_CREATURES) creatures.shift();
}

/* ── p5 sketch ───────────────────────────────────────────── */
new p5(function(p) {
  let W, H;
  let rotY = 0, tiltX = 0.3;
  let cubeSize = 200;
  let charPos = CHARS.map(() => ({x:0,y:0,z:0}));
  let charTrails = CHARS.map(() => []);
  const TRAIL = 24;
  let fc = 0;
  let dropPulse = 0; // visual pulse on drop
  let isDrag = false, lastMX = 0;
  let autoRot = true;

  function getRatio() { return RATIOS[currentRatio]; }

  function proj(x, y, z) {
    const cosY=Math.cos(rotY),sinY=Math.sin(rotY);
    let rx=x*cosY-z*sinY, ry=y, rz=x*sinY+z*cosY;
    const cosX=Math.cos(tiltX),sinX=Math.sin(tiltX);
    let tx=rx, ty=ry*cosX-rz*sinX, tz=ry*sinX+rz*cosX;
    const fov=580, depth=tz+fov+cubeSize*2.5, s=fov/depth;
    return { x:W/2+tx*s, y:H*0.46+ty*s, s, d:tz };
  }

  function drawCube() {
    const r=getRatio();
    const hw=cubeSize*r.w*.5, hh=cubeSize*r.h*.5, hd=cubeSize*r.d*.5;
    const C=[ [-hw,-hh,-hd],[hw,-hh,-hd],[hw,hh,-hd],[-hw,hh,-hd],
              [-hw,-hh, hd],[hw,-hh, hd],[hw,hh, hd],[-hw,hh, hd] ].map(([x,y,z])=>proj(x,y,z));
    const E=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    const ctx=p.drawingContext;
    ctx.save();
    // Pulse cube border on beat (approximated by frame modulo at BPM)
    const bpmPulse = isDropping ? 0.5 : (Math.sin(fc*0.08)*0.5+0.5)*0.1+0.1;
    ctx.strokeStyle=`rgba(79,195,247,${bpmPulse})`;
    ctx.lineWidth=1;
    E.forEach(([a,b])=>{ ctx.beginPath();ctx.moveTo(C[a].x,C[a].y);ctx.lineTo(C[b].x,C[b].y);ctx.stroke(); });
    // Floor grid
    ctx.strokeStyle=`rgba(105,240,174,0.05)`;
    for(let i=-3;i<=3;i++){
      const gx=(hw/3)*i;
      const a=proj(gx,hh,-hd),b=proj(gx,hh,hd),c2=proj(-hw,hh,(hd/3)*i),d=proj(hw,hh,(hd/3)*i);
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(c2.x,c2.y);ctx.lineTo(d.x,d.y);ctx.stroke();
    }
    ctx.restore();
  }

  function updateChars(t) {
    const r=getRatio(); totalFrames++;
    for(let i=0;i<7;i++){
      const d=DANCE[i], spd=0.55+(isDropping?0.4:0);
      charPos[i]={
        x:Math.sin(d.fx*t*spd+d.px)*cubeSize*r.w*.42,
        y:Math.sin(d.fy*t*spd+d.py)*cubeSize*r.h*.42,
        z:Math.sin(d.fz*t*spd+d.pz)*cubeSize*r.d*.42,
      };
      charTrails[i].push({...charPos[i]});
      if(charTrails[i].length>TRAIL) charTrails[i].shift();
    }
    const cDist=cubeSize*Math.min(getRatio().w,getRatio().h,getRatio().d)*0.36;
    for(let i=0;i<7;i++) for(let j=i+1;j<7;j++){
      const dx=charPos[i].x-charPos[j].x,dy=charPos[i].y-charPos[j].y,dz=charPos[i].z-charPos[j].z;
      const inContact=Math.sqrt(dx*dx+dy*dy+dz*dz)<cDist;
      contactActive[i][j]=inContact;
      if(inContact) contactFrames[i][j]++;
    }
  }

  function drawTrails() {
    const ctx=p.drawingContext;
    for(let i=0;i<7;i++){
      const tr=charTrails[i]; if(tr.length<2) continue;
      for(let k=1;k<tr.length;k++){
        const al=(k/tr.length)*0.35;
        const pa=proj(tr[k-1].x,tr[k-1].y,tr[k-1].z);
        const pb=proj(tr[k].x,tr[k].y,tr[k].z);
        ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);
        ctx.strokeStyle=`hsla(${CHARS[i].h},${CHARS[i].s}%,${CHARS[i].b}%,${al})`;
        ctx.lineWidth=1.4*pb.s; ctx.stroke();
      }
    }
  }

  function drawContactBeams() {
    const ctx=p.drawingContext;
    for(let i=0;i<7;i++) for(let j=i+1;j<7;j++){
      if(!contactActive[i][j]) continue;
      const a=proj(charPos[i].x,charPos[i].y,charPos[i].z);
      const b=proj(charPos[j].x,charPos[j].y,charPos[j].z);
      ctx.save();
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1.5;
      ctx.shadowBlur=10;ctx.shadowColor='rgba(255,255,255,0.4)';
      ctx.stroke();ctx.restore();
    }
  }

  function drawChar(i, t) {
    const c=CHARS[i], pp=proj(charPos[i].x,charPos[i].y,charPos[i].z);
    const r=9*pp.s, ctx=p.drawingContext;
    ctx.save();
    ctx.shadowBlur=18*pp.s;ctx.shadowColor=`hsl(${c.h},${c.s}%,${c.b}%)`;
    const g=ctx.createRadialGradient(pp.x,pp.y,0,pp.x,pp.y,r*1.7);
    g.addColorStop(0,`hsla(${c.h},${c.s}%,${c.b+15}%,.9)`);
    g.addColorStop(.5,`hsla(${c.h},${c.s}%,${c.b}%,.5)`);
    g.addColorStop(1,`hsla(${c.h},${c.s}%,${c.b-10}%,0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(pp.x,pp.y,r*1.7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`hsla(${c.h},${c.s}%,${Math.min(100,c.b+20)}%,1)`;
    ctx.beginPath();ctx.arc(pp.x,pp.y,r*.4,0,Math.PI*2);ctx.fill();
    // fin
    const fs=Math.sin(t*3+i)*.28;
    const fy=pp.y+r*2.1;
    ctx.beginPath();ctx.moveTo(pp.x,pp.y+r*.5);
    ctx.quadraticCurveTo(pp.x+fs*r*4,fy,pp.x+r*1.1,fy+r*.7);
    ctx.quadraticCurveTo(pp.x,fy+r*.3,pp.x-r*1.1,fy+r*.7);
    ctx.quadraticCurveTo(pp.x-fs*r*4,fy,pp.x,pp.y+r*.5);
    ctx.closePath();ctx.fillStyle=`hsla(${c.h},${c.s}%,${c.b}%,.5)`;ctx.fill();
    ctx.font=`${Math.max(7,9*pp.s)}px 'Space Grotesk',sans-serif`;
    ctx.fillStyle=`hsla(${c.h},${c.s}%,95%,.85)`;ctx.textAlign='center';
    ctx.shadowBlur=5;ctx.fillText(c.name,pp.x,pp.y-r*2);
    ctx.restore();
  }

  /* ── BUBBLES ── */
  function updateBubbles() {
    const ctx=p.drawingContext;
    for(let i=bubbles.length-1;i>=0;i--){
      const b=bubbles[i];
      b.x+=b.vx; b.y+=b.vy;
      b.vy+=0.04; // gravity
      b.vx*=0.99;
      b.life-=0.014;
      if(b.life<=0||b.y>H+40){
        if(!b.popped){ b.popped=true; spawnCreature(b.x,b.y); }
        bubbles.splice(i,1); continue;
      }
      // pop near top
      if(b.y<60&&!b.popped){ b.popped=true; spawnCreature(b.x,b.y); }

      const al=Math.min(1,b.life*2)*0.75;
      ctx.save();
      // bubble body
      const bg=ctx.createRadialGradient(b.x-b.r*.3,b.y-b.r*.3,b.r*.05,b.x,b.y,b.r);
      bg.addColorStop(0,`hsla(${b.hue},60%,90%,${al*.5})`);
      bg.addColorStop(.6,`hsla(${b.hue},50%,70%,${al*.25})`);
      bg.addColorStop(1,`hsla(${b.hue},40%,50%,${al*.5})`);
      ctx.fillStyle=bg;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      // rim
      ctx.strokeStyle=`hsla(${b.hue+40},70%,80%,${al*.8})`;
      ctx.lineWidth=1;ctx.stroke();
      // highlight
      ctx.fillStyle=`rgba(255,255,255,${al*.4})`;
      ctx.beginPath();ctx.ellipse(b.x-b.r*.3,b.y-b.r*.3,b.r*.3,b.r*.18,-.5,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }

  /* ── CREATURES ── */
  function drawAmoeba(ctx, cr, t) {
    const n=12, hue=cr.hue;
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2;
      const off=cr.pts[i%cr.pts.length];
      const rr=cr.r*(0.7+0.25*Math.sin(off.freq*t+off.ph)+off.off);
      const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle=`hsla(${hue},60%,52%,${cr.alpha*.65})`;
    ctx.strokeStyle=`hsla(${hue},70%,75%,${cr.alpha*.9})`;
    ctx.lineWidth=1.5; ctx.fill(); ctx.stroke();
    // nucleus
    ctx.beginPath();ctx.arc(cr.r*.15,cr.r*.1,cr.r*.22,0,Math.PI*2);
    ctx.fillStyle=`hsla(${hue+20},70%,70%,${cr.alpha*.5})`;ctx.fill();
  }

  function drawJellyfish(ctx, cr, t) {
    const hue=cr.hue, puls=0.08*Math.sin(t*2.5+cr.phase);
    // dome
    ctx.beginPath();
    ctx.arc(0,-cr.r*.1,cr.r*(1+puls),Math.PI,0);
    ctx.closePath();
    ctx.fillStyle=`hsla(${hue},55%,55%,${cr.alpha*.5})`;
    ctx.strokeStyle=`hsla(${hue},70%,78%,${cr.alpha*.85})`;
    ctx.lineWidth=1.5;ctx.fill();ctx.stroke();
    // inner dome
    ctx.beginPath();ctx.arc(0,0,cr.r*(0.6+puls),Math.PI,0);
    ctx.fillStyle=`hsla(${hue+15},60%,65%,${cr.alpha*.25})`;ctx.fill();
    // tentacles
    for(let i=0;i<6;i++){
      const tx=(i/5-0.5)*cr.r*1.6;
      const wave=Math.sin(t*2+i*1.1+cr.phase)*cr.r*.5;
      ctx.beginPath();ctx.moveTo(tx,0);
      ctx.quadraticCurveTo(tx+wave,cr.r*.9,tx+wave*.5,cr.r*1.6);
      ctx.strokeStyle=`hsla(${hue},60%,70%,${cr.alpha*.5})`;
      ctx.lineWidth=1.5; ctx.stroke();
    }
  }

  function drawPolyp(ctx, cr, t) {
    const hue=cr.hue, arms=cr.arms;
    ctx.beginPath();ctx.arc(0,0,cr.r*.38,0,Math.PI*2);
    ctx.fillStyle=`hsla(${hue},65%,50%,${cr.alpha*.7})`;ctx.fill();
    for(let i=0;i<arms;i++){
      const a=(i/arms)*Math.PI*2+t*.3;
      const len=cr.r*(0.9+0.15*Math.sin(t*1.8+i));
      ctx.beginPath();ctx.moveTo(Math.cos(a)*cr.r*.35,Math.sin(a)*cr.r*.35);
      const ex=Math.cos(a)*len, ey=Math.sin(a)*len;
      ctx.quadraticCurveTo((ex+Math.cos(a+.4)*len*.6),(ey+Math.sin(a+.4)*len*.6),ex,ey);
      ctx.strokeStyle=`hsla(${hue},65%,68%,${cr.alpha*.75})`;
      ctx.lineWidth=2.5-i*.15;ctx.lineCap='round';ctx.stroke();
      ctx.beginPath();ctx.arc(ex,ey,2.5,0,Math.PI*2);
      ctx.fillStyle=`hsla(${hue+30},70%,80%,${cr.alpha*.9})`;ctx.fill();
    }
  }

  function drawStarfish(ctx, cr, t) {
    const hue=cr.hue, arms=5;
    ctx.beginPath();
    for(let i=0;i<arms*2;i++){
      const a=(i/arms/2)*Math.PI*2+t*.12;
      const rr=i%2===0?cr.r:cr.r*.42;
      const off=i%2===0?cr.pts[i%cr.pts.length].off*cr.r*.2:0;
      const x=Math.cos(a)*(rr+off), y=Math.sin(a)*(rr+off);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle=`hsla(${hue},60%,52%,${cr.alpha*.65})`;
    ctx.strokeStyle=`hsla(${hue},70%,75%,${cr.alpha*.85})`;
    ctx.lineWidth=1.5;ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,cr.r*.28,0,Math.PI*2);
    ctx.fillStyle=`hsla(${hue+15},70%,70%,${cr.alpha*.7})`;ctx.fill();
  }

  function drawMedusa(ctx, cr, t) {
    const hue=cr.hue;
    // bell
    ctx.save();
    ctx.scale(1,0.6);
    ctx.beginPath();ctx.arc(0,0,cr.r,0,Math.PI*2);
    ctx.restore();
    ctx.beginPath();
    ctx.ellipse(0,-cr.r*.15, cr.r, cr.r*(0.55+0.07*Math.sin(t*2+cr.phase)),0,0,Math.PI*2);
    ctx.fillStyle=`hsla(${hue},50%,55%,${cr.alpha*.45})`;
    ctx.strokeStyle=`hsla(${hue},65%,75%,${cr.alpha*.8})`;
    ctx.lineWidth=1.5;ctx.fill();ctx.stroke();
    // oral arms
    for(let i=0;i<4;i++){
      const a=(i/4)*Math.PI*2+cr.phase;
      const bx=Math.cos(a)*cr.r*.3, by=Math.sin(a)*cr.r*.3+cr.r*.3;
      ctx.beginPath();ctx.moveTo(bx,by);
      const ex=bx+Math.cos(a+Math.sin(t+i)*.5)*cr.r*.8;
      const ey=by+cr.r*(0.7+.3*Math.sin(t*1.2+i));
      ctx.quadraticCurveTo(bx+Math.cos(a)*cr.r*.5,by+cr.r*.5,ex,ey);
      ctx.strokeStyle=`hsla(${hue},60%,70%,${cr.alpha*.45})`;
      ctx.lineWidth=1.8;ctx.stroke();
    }
  }

  function updateCreatures(t) {
    const ctx=p.drawingContext;
    for(const cr of creatures){
      cr.alpha=Math.min(1,cr.alpha+0.025);
      cr.x+=cr.vx; cr.y+=cr.vy;
      cr.rot+=cr.rotSpd;
      cr.vx*=0.995; cr.vy*=0.995;
      // soft boundary bounce
      if(cr.x<cr.r||cr.x>W-cr.r) cr.vx*=-1;
      if(cr.y<80+cr.r||cr.y>H-50-cr.r) cr.vy*=-1;
      ctx.save();
      ctx.translate(cr.x,cr.y);ctx.rotate(cr.rot);
      switch(cr.type){
        case 0: drawAmoeba(ctx,cr,t);    break;
        case 1: drawJellyfish(ctx,cr,t); break;
        case 2: drawPolyp(ctx,cr,t);     break;
        case 3: drawStarfish(ctx,cr,t);  break;
        case 4: drawMedusa(ctx,cr,t);    break;
      }
      ctx.restore();
    }
  }

  /* ── beat flash ── */
  function drawBeatFlash(t) {
    if(!isDropping) return;
    const ctx=p.drawingContext;
    const a=Math.max(0,0.18-((t%0.1)/0.1)*0.18);
    ctx.save();
    ctx.fillStyle=`rgba(79,195,247,${a})`;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  p.setup = function() {
    W=p.windowWidth; H=p.windowHeight;
    const cv=p.createCanvas(W,H); cv.parent('p5host');
    cubeSize=Math.min(W,H)*0.26;
    p.frameRate(60);
  };
  p.windowResized = function() {
    W=p.windowWidth; H=p.windowHeight;
    p.resizeCanvas(W,H);
    cubeSize=Math.min(W,H)*0.26;
  };

  p.draw = function() {
    const t=p.millis()*.001; fc++;
    p.clear();
    if(autoRot) rotY+=0.0035+(isDropping?.006:0);
    tiltX=0.28+Math.sin(t*.09)*.04;

    updateChars(t);
    const order=CHARS.map((c,i)=>({i,d:proj(charPos[i].x,charPos[i].y,charPos[i].z).d})).sort((a,b)=>a.d-b.d);

    drawCube();
    drawTrails();
    drawContactBeams();
    order.forEach(({i})=>drawChar(i,t));

    // creatures behind glass (draw first)
    updateCreatures(t);
    updateBubbles();
    drawBeatFlash(t);

    if(fc%24===0){ updateContactUI(); CHARS.forEach((_,i)=>{ let a=0; for(let j=0;j<7;j++) if(j!==i&&contactActive[i][j])a++; const el=document.getElementById(`act-${i}`); if(el)el.style.width=(40+a*20)+'%'; }); }
  };

  p.mousePressed = function() {
    if(p.mouseButton===p.RIGHT) return;
    spawnBubbles(p.mouseX, p.mouseY);
    isDrag=true; lastMX=p.mouseX; autoRot=false;
  };
  p.mouseDragged = function() {
    if(!isDrag) return;
    rotY+=(p.mouseX-lastMX)*.011; lastMX=p.mouseX;
  };
  p.mouseReleased = function() {
    isDrag=false; setTimeout(()=>{autoRot=true;},2000);
  };
  p.touchStarted = function() {
    if(p.touches.length>0){
      spawnBubbles(p.touches[0].x, p.touches[0].y);
    }
    return false;
  };
});
</script>
</body>
</html>
